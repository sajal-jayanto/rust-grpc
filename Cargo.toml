[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hello-server"
path = "src/server.rs"

[[bin]]
name = "hello-client"
path = "src/client.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tonic-prost-build = "0.14"